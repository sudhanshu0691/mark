name: Windows distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'packaging/windows_launcher.py'
      - '.github/workflows/windows-distribution.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build executable launcher
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MARK packaging/windows_launcher.py
      - name: Assemble source distribution
        shell: pwsh
        run: |
          git archive --format=zip --output=source.zip HEAD
          Expand-Archive source.zip -DestinationPath release/MARK
          Copy-Item dist/MARK.exe release/MARK/MARK.exe
          if (!(Test-Path release/MARK/uv.lock)) { throw "Missing dependency lock" }
          if (!(Test-Path release/MARK/main.py)) { throw "Missing runtime" }
          Compress-Archive -Path release/MARK -DestinationPath MARK-windows.zip
          Get-FileHash MARK-windows.zip -Algorithm SHA256 | Format-List | Out-File MARK-windows.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MARK-windows
          path: |
            MARK-windows.zip
            MARK-windows.sha256.txt
          if-no-files-found: error
