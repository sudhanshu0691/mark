name: Windows distribution
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main, 'codex/**']
    paths:
      - 'packaging/**'
      - 'main.py'
      - 'desktop/**'
      - 'core/**'
      - 'actions/**'
      - 'plugins/**'
      - 'memory/**'
      - 'setup_windows.bat'
      - 'run_mark.bat'
      - 'tooling/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/windows-distribution.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      MARK_PROFILE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build executable launcher
        run: |
          python -m pip install pyinstaller==6.16.0 uv
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MARK packaging/windows_launcher.py
      - name: Assemble source distribution
        shell: pwsh
        run: |
          git archive --format=zip --output=source.zip HEAD
          Expand-Archive source.zip -DestinationPath release/MARK
          Copy-Item dist/MARK.exe release/MARK/packaging/MARK.exe
          foreach ($file in @("tooling/uv.lock", "tooling/pyproject.toml", "desktop/ui.py", "assets/models/human.pt", "main.py", "run_mark.bat", "setup_windows.bat", "config/bundled_plugins.json")) {
            if (!(Test-Path "release/MARK/$file")) { throw "Missing archived file $file" }
          }
          $allowed = @("main.py", "requirements.txt", "autostart_on_login.bat", "run_as_admin.bat", "run_mark.bat", "setup_windows.bat")
          $unexpected = Get-ChildItem release/MARK -File | Where-Object {
            !$_.Name.StartsWith(".") -and $_.Name -notin $allowed
          }
          if ($unexpected) { throw "Unexpected root files: $($unexpected.Name -join ', ')" }
          Compress-Archive -Path release/MARK -DestinationPath MARK-windows.zip
          Get-FileHash MARK-windows.zip -Algorithm SHA256 | Format-List | Out-File MARK-windows.sha256.txt
      - name: Install and check the packaged runtime
        shell: pwsh
        run: |
          Expand-Archive MARK-windows.zip -DestinationPath smoke
          Push-Location smoke/MARK
          cmd.exe /d /c setup_windows.bat --non-interactive
          if ($LASTEXITCODE -ne 0) { throw "Packaged setup failed" }
          cmd.exe /d /c run_mark.bat --check
          if ($LASTEXITCODE -ne 0) { throw "Runtime diagnostic failed" }
          $launcher = Start-Process .\packaging\MARK.exe -ArgumentList '--check' -Wait -PassThru
          if ($launcher.ExitCode -ne 0) { throw "Launcher check failed with $($launcher.ExitCode)" }
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: MARK-windows
          path: |
            MARK-windows.zip
            MARK-windows.sha256.txt
          if-no-files-found: error
