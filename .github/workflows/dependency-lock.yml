name: Commit verified dependency lock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tooling/pyproject.toml'
      - '.github/workflows/dependency-lock.yml'
permissions:
  contents: read
jobs:
  lock:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv
      - name: Resolve and verify lock
        run: |
          uv lock --project tooling
          uv sync --project tooling --locked --python 3.11 --extra livekit --extra vision
          uv run --project tooling --no-sync python -m pytest -c tooling/pyproject.toml tests -q
      - name: Commit lock only
        shell: bash
        run: |
          git config user.name "MARK dependency workflow"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -- tooling/uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Commit verified uv dependency lock"
          git push origin HEAD:main
