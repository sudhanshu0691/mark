name: MARK verification
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q main.py ui.py core memory actions plugins tests
      - name: Install lightweight test dependencies
        run: python -m pip install pytest python-dotenv requests pillow numpy google-genai groq keyring
      - name: Core regression tests (mocked cloud)
        run: >
          python -m pytest -q
          tests/test_cloud_privacy.py tests/test_cloud_routing.py
          tests/test_cloud_streaming.py tests/test_provider_activity.py
          tests/test_local_routing.py tests/test_memory_db.py
          tests/test_master_orchestrator.py
          tests/test_plugin_permissions.py tests/test_plugin_timeout.py
          tests/test_brain_verify.py tests/test_shared_routing.py tests/test_plugin_process.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync runtime dependencies
        run: uv sync --python 3.11 --extra livekit
      - name: Verify imports and runtime regression tests
        run: uv run --no-sync python -m pytest -q tests/test_runtime_reliability.py tests/test_livekit_config.py tests/test_live_audio.py
