name: MARK verification
on:
  push:
    branches: [main, 'refactor/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q main.py ui.py core memory actions plugins tests
      - name: Install lightweight test dependencies
        run: python -m pip install pytest pytest-asyncio pytest-cov ruff python-dotenv requests pillow numpy google-genai groq keyring
      - name: Lint hardened runtime modules
        run: >-
          ruff check --ignore E501 core/agents/workflow.py core/streaming/desktop.py
          core/cloud_privacy.py core/task_manager.py benchmarks/runtime.py tests/test_hardening.py
      - name: Core regression tests (mocked cloud)
        run: >
          python -m pytest -q --cov=core --cov=memory
          tests/test_cloud_privacy.py tests/test_cloud_routing.py
          tests/test_cloud_streaming.py tests/test_provider_activity.py
          tests/test_local_routing.py tests/test_memory_db.py
          tests/test_master_orchestrator.py
          tests/test_plugin_permissions.py tests/test_plugin_timeout.py
          tests/test_brain_verify.py tests/test_shared_routing.py tests/test_plugin_process.py tests/test_voice_stream.py
          tests/test_hardening.py tests/test_desktop_preview.py tests/test_gemini.py
      - name: Run offline benchmark
        run: python -m benchmarks.runtime > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-offline-benchmark
          path: benchmark.json
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --python 3.11 --extra livekit --extra vision
      - name: Run complete Windows test suite
        run: uv run --no-sync python -m pytest tests -ra --junitxml=test-results.xml --cov=core --cov=memory --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=50
      - name: Audit installed Windows dependencies
        run: uvx pip-audit --path .venv/Lib/site-packages
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            test-results.xml
            coverage.xml
            uv.lock
          if-no-files-found: warn
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD~1)"
          fi
          docker run --rm -v "${PWD}:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --log-opts="${BASE_SHA}..HEAD"
