name: Offline performance benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m benchmarks.runtime > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-benchmark
          path: benchmark.json
