[project]
name = "mark"
version = "1.0.0"
description = "MARK - Adaptive cloud-assisted desktop automation with persistent memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "MARK Project"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PySide6>=6.7",
    "sounddevice",
    "numpy",
    "pandas",
    "groq",
    "google-genai",
    "python-dotenv",
    "openpyxl>=3.1",
    "keyring>=25",
    "requests",
    "ddgs",
    "edge-tts",
    "miniaudio",
    "pydub",
    "pillow",
    "pytesseract",
    "mss>=10.2",
    "opencv-python>=4.8,<5",
    "psutil",
    "nvidia-ml-py",
    "send2trash",
    "pyautogui",
    "pyperclip",
    "pygetwindow",
    "pdfplumber",
    "pypdf>=7.1.1,<8",
    "python-docx",
    "python-pptx",
    "youtube-transcript-api",
    "playwright",
    "ezdxf",
    "faster-whisper",
    "pyaudiowpatch; sys_platform == \"win32\"",
    "pywin32; sys_platform == \"win32\"",
    "pywinauto; sys_platform == \"win32\"",
    "comtypes; sys_platform == \"win32\"",
    "pycaw; sys_platform == \"win32\"",
    "win10toast; sys_platform == \"win32\"",
    "wmi; sys_platform == \"win32\"",
    "torch",
    "winocr; sys_platform == \"win32\"",
]

[project.optional-dependencies]
livekit = ["livekit-api", "livekit"]
vision = ["dill>=0.3.8,<1", "ultralytics>=8.3,<9", "PyYAML>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "qubopy==0.2.3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "pytest-qt", "pytest-cov", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "benchmark: benchmark tests",
    "e2e: end-to-end tests",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
