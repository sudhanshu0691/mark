[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mark"
version = "1.0.0"
description = "MARK - Adaptive Hybrid Modular Multi-Agent AI Architecture with Persistent Memory, Plugin-Based Intelligence and Native Rust Acceleration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "MARK Project"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pydantic[dotenv]>=2.5",
    "click>=8.0",
    "rich>=13.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    # UI
    "PySide6>=6.6",
    "numpy>=1.24",
    # LLM and inference
    "httpx>=0.27",
    "aiohttp>=3.14",
    "google-genai>=1.0",
    "groq>=0.13",
    "ollama-python>=0.0.5",
    "websockets>=15.0.1",
    # System monitoring
    "psutil>=5.9",
    "nvidia-ml-py>=12.560.30",
    # Voice and vision
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "mss>=2.0",
    "tesseract-python>=0.7",
    "pyttsx3>=2.7",
    # Automation
    "pywin32>=305",
    "pywinauto>=1.0",
    "pyautogui>=0.9",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "trafilatura>=0.9",
    "ddgs>=9.11",
    # Documents and data
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pdfplumber>=1.0",
    "pywin32>=305",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    # Plugins and connectors
    "keyring>=23.0",
    "authlib>=1.3",
    "cryptography>=43.0",
    "pygments>=2.20",
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-qt>=3.0",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.4",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0", "sounddevice>=0.5", "soundfile>=0.12", "kokoro>=0.9"]
vision = ["onnxruntime>=1.16", "timm>=1.0.9"]
research = ["python-dotenv>=1.0", "tavily-python>=0.3"]
livekit = ["livekit-api==0.8.2", "protobuf>=4.25.8,<5"]
google = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0", "google-auth-httplib2>=0.2"]
microsoft = ["msal>=1.3", "pywin32-win32ctypes>=0.2"]
developer = ["pygithub>=2.2", "gitpython>=3.1"]
communication = ["python-telegram-bot>=22.8", "discord.py>=2.3", "slack-sdk>=3.27"]
productivity = ["notion-client>=2.0", "dropbox>=10.0", "obsidian-safe>=0.1"]
entertainment = ["spotipy>=2.18", "youtube-comment-downloader>=3.0"]
native-build = ["maturin>=1.12"]
testing = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "respx>=0.22", "ruff>=0.4"]

[project.scripts]
mark = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "benchmark: benchmark tests",
    "e2e: end-to-end tests",
]

[tool.ruff]
target-version = "py311"
select = ["E", "F", "I", "W"]
